services:
  nestor:
    build: .
    restart: unless-stopped
    user: "${NESTOR_UID}:${NESTOR_GID}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      VIRTUAL_HOST: "${NESTOR_VIRTUAL_HOST}"
      VIRTUAL_PORT: "8790"
      LETSENCRYPT_HOST: "${NESTOR_VIRTUAL_HOST}"
    networks:
      - proxy
    volumes:
      - /etc/nestor/config.yaml:/etc/nestor/config.yaml:ro
    healthcheck:
      test: wget -qO- http://127.0.0.1:8790/healthz || exit 1
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  proxy:
    name: "${NESTOR_PROXY_NETWORK}"
    external: true
